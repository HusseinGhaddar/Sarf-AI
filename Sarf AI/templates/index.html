<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>sarf ai</title>
  <style>
    /* Arabic-inspired professional funky theme */
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&display=swap');

    :root {
      /* Palette from user's provided image */
      --main-bg: #ffffff;           /* white */
      --panel-bg: #e6f9fa;         /* very light cyan (faint) */
      --accent: #00b3b3;           /* bright cyan */
      --secondary: #005b5b;        /* dark teal */
      --text-main: #003737;        /* very dark teal */
      --text-light: #005b5b;       /* dark teal */
      --error-bg: #f5e6e0;         /* light warm neutral */
      --error-border: #a65c3a;     /* brownish */
      --result-bg: #daf7f7;        /* pale cyan */
      --result-border: #009797;    /* medium teal */
      --border-radius: 12px;
      --shadow-light: rgba(0, 0, 0, 0.05);
      --shadow-deep: rgba(0, 0, 0, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
      background: var(--main-bg);
      color: var(--text-main);
      line-height: 1.6;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: var(--panel-bg);
      max-width: 600px;
      width: 100%;
      padding: 30px;
      border-radius: var(--border-radius);
      box-shadow: 0 8px 24px var(--shadow-deep);
      border: 4px solid var(--accent);
    }

    h1 {
      font-size: 1.8rem;
      text-align: center;
      color: var(--secondary);
      margin-bottom: 1rem;
      position: relative;
    }
    h1::after {
      content: '';
      display: block;
      width: 60px;
      height: 4px;
      background: var(--accent);
      margin: 8px auto 0;
      border-radius: 2px;
    }

    form {
      margin-top: 20%;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    label {
      font-weight: 600;
      color: var(--secondary);
    }

    input[name="sentence"] {
      padding: 12px 16px;
      font-size: 1.1rem;
      border: 2px dashed var(--accent);
      border-radius: var(--border-radius);
      text-align: right;
      direction: rtl;
      transition: border-color 0.3s;
    }
    input[name="sentence"]:focus {
      outline: none;
      border-color: var(--secondary);
      box-shadow: 0 0 0 3px var(--shadow-light);
    }

    button[type="submit"] {
      width: 100%;
      padding: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--border-radius);
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: background 0.3s, transform 0.2s;
    }
    button[type="submit"]:hover {
      background: var(--secondary);
      transform: translateY(-2px);
    }

    .message {
      padding: 16px;
      border-radius: var(--border-radius);
      margin-top: 20px;
      white-space: pre-wrap;
      font-size: 1rem;
      line-height: 1.4;
      box-shadow: 0 4px 12px var(--shadow-light);
    }
    .error {
      background: #caffef;
      border-left: 6px solid #ff4d4d;
      color: #660000;
    }
    .result {
      background: #fffbda;
      border-left: 6px solid #006b66;
      color: #1b5e20;
    }

    @media (max-width: 480px) {
      .container {
        padding: 20px;
      }
      input[name="sentence"], button {
        font-size: 1rem;
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container" size="2">
    <h1>Sarf AI</h1>
    <form method="POST" action="/">
      <div class="field-group">
        <label for="sentence">أدخل جملة عربية (كلمتان أو ثلاث):</label>
        <input type="text" id="sentence" name="sentence" placeholder="مثال: الطالب نشيط" required />
      </div>
      <button type="submit">تحليل</button>
    </form>
    {% if error %}
      <div class="message error">{{ error }}</div>
    {% endif %}
    {% if result %}
      <div class="message result">{{ result }}</div>
    {% endif %}
  </div>
</body>
</html>
